name: RW Studio - Contribution Animation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate monochrome animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: robson400
          outputs: |
            dist/contributions.svg?palette=github-light&color_snake=black&color_dots=#ebedf0,#d4d4d4,#a3a3a3,#737373,#262626
            dist/contributions-dark.svg?palette=github-dark&color_snake=white&color_dots=#161616,#333333,#555555,#888888,#cccccc

      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
