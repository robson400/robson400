name: Contribution animation
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions.svg?color_snake=%23777777&color_dots=%23eeeeee,%23cccccc,%23999999,%23666666,%23333333
            dist/contributions-dark.svg?color_snake=%23ffffff&color_dots=%23181818,%23333333,%23555555,%23888888,%23bbbbbb
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
