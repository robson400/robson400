<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title"><title id="title">Terminal RW: aprender, construir, compartilhar e evoluir</title><rect width="900" height="240" rx="10" fill="#121214"/><path d="M0 40H900" stroke="#444"/><g fill="#888"><circle cx="22" cy="20" r="4"/><circle cx="36" cy="20" r="4"/><circle cx="50" cy="20" r="4"/></g><g font-family="monospace" font-size="14" fill="#d5d5d5"><text x="76" y="25" fill="#aaa">rw@studio: ~/manifesto</text><text x="26" y="70">$ ./build-with-purpose</text><text x="26" y="101">[01] Aprender com intenção.</text><text x="26" y="130">[02] Construir com critério.</text><text x="26" y="159">[03] Compartilhar conhecimento.</text><text x="26" y="188">[04] Evoluir continuamente.</text><text x="26" y="219">$</text></g><g fill="#aaa"><rect x="630" y="89" width="180" height="3" rx="1"/><rect x="630" y="118" width="180" height="3" rx="1"/><rect x="630" y="147" width="180" height="3" rx="1"/><rect x="630" y="176" width="180" height="3" rx="1"/></g><g fill="#f6f6f6"><rect x="630" y="89" width="180" height="3"><animate attributeName="width" values="0;180;180" keyTimes="0;.25;1" dur="8s" repeatCount="indefinite"/></rect><rect x="630" y="118" width="180" height="3"><animate attributeName="width" values="0;0;180;180" keyTimes="0;.25;.5;1" dur="8s" repeatCount="indefinite"/></rect><rect x="630" y="147" width="180" height="3"><animate attributeName="width" values="0;0;180;180" keyTimes="0;.5;.75;1" dur="8s" repeatCount="indefinite"/></rect><rect x="630" y="176" width="180" height="3"><animate attributeName="width" values="0;0;180;180" keyTimes="0;.75;.95;1" dur="8s" repeatCount="indefinite"/></rect><rect x="45" y="207" width="9" height="14"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></g></svg>
